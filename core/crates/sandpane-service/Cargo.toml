[package]
name = "sandpane-service"
description = "Persistent per-user Sandpane Core service: local IPC server (Unix socket / NDJSON), single-instance handshake, request dispatch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "sandpane-service"
path = "src/main.rs"

[lib]
name = "sandpane_service"
path = "src/lib.rs"

[dependencies]
sandpane-core = { workspace = true }
sandpane-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
rusqlite = { workspace = true }
# OS RNG for 256-bit destructive-action confirmation tokens (A1). Already in
# the lockfile (uuid's own RNG); pinned to that resolved version.
getrandom = "=0.4.3"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = "3.27.0"
