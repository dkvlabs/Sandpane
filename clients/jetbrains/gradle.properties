# Sandpane JetBrains client — build properties.
#
# Version pins were checked against the publishing registries on 09.10.2026 and the build was run
# with them (see README.md "Checks actually run"). The Gradle plugin versions themselves
# (Kotlin 2.4.21, IntelliJ Platform Gradle Plugin 2.19.0) live in build.gradle.kts `plugins {}` —
# Gradle cannot read them from here — and foojay 1.0.0 lives in settings.gradle.kts.

# --- plugin identity (mirrors META-INF/plugin.xml) ---
pluginGroup=labs.dkv.sandpane
pluginName=Sandpane
pluginVersion=0.1.0-scaffold

# --- IDE baseline: specs/04 §1 + §4 JB0 ---
# IntelliJ IDEA 2026.2.3 (build 262.10968.63, JetBrains releases API, released 2026-09-16).
# Since 2025.3 there is no separate Community artifact: the build uses the unified
# `intellijIdea(...)` dependency, so there is no platformType property any more.
# The build range is exactly what this build compiles and Plugin-Verifier-checks against: 262 only.
# Widening the range (older or newer builds) requires verifying against those IDEs first.
# IPGP's verifyPluginProjectConfiguration recommends dropping until-build for 243+; that is NOT
# followed on purpose — an open-ended range would advertise compatibility with IDE builds nobody
# has verified (AGENTS.md rule 5).
platformVersion=2026.2.3
pluginSinceBuild=262
pluginUntilBuild=262.*

# --- toolchain pins ---
# IntelliJ IDEA 2026.2.3 requires Java 25, established from the IDE itself (not assumed):
# product-info.json `minRequiredJavaVersion: 25`, bundled JBR 25.0.4, platform classes are
# class-file major 69 (Java 25), and IPGP's verifyPluginProjectConfiguration rejects a 21 target
# ("IntelliJ Platform '2026.2.3' requires Java '25'"). So the plugin compiles with a JDK 25
# toolchain. No JDK 25 needs to be installed: the foojay resolver (settings.gradle.kts)
# provisions it into ~/.gradle/jdks.
kotlinxSerializationVersion=1.11.0
javaToolchainVersion=25

# --- Kotlin flags ---
# The IntelliJ Platform ships its own Kotlin stdlib; the platform plugin docs
# recommend not adding a stdlib dependency to the distribution (compiles with KGP 2.4.21;
# runtime coexistence inside an IDE is still a JB0 open item — see README).
kotlin.stdlib.default.dependency=false
kotlin.code.style=official
# Experimental API opt-in is done per-site with @OptIn(ExperimentalSerializationApi::class)
# in labs/dkv/sandpane/model/Models.kt — no global -opt-in compiler flag in this scaffold.

org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Searchable options are disabled for a scaffold: indexing the sandbox IDE on every
# build is slow and adds no verified value before JB4.
enableBuildSearchableOptions=false
