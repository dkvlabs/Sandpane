# Sandpane JetBrains client — build properties.
#
# EVERY VALUE BELOW IS A JB0 PIN, RECORDED AS UNVERIFIED.
# Nothing in this scaffold was resolved or compiled on the authoring host
# (no IntelliJ Platform artifact download, no Kotlin compile, no test run —
# see README.md "Not verified on this host").

# --- plugin identity (mirrors META-INF/plugin.xml) ---
pluginGroup=labs.dkv.sandpane
pluginName=Sandpane
pluginVersion=0.1.0-scaffold

# --- IDE baseline: specs/04 §1 + §4 JB0 ---
# IC 2024.2.4 is the proposed CI baseline (Community is headless-verifiable);
# the *product* baseline statement in specs/04 is "IntelliJ IDEA", so IU must be
# added to the runIde/Plugin Verifier matrix before JB0 can close.
platformType=IC
platformVersion=2024.2.4
pluginSinceBuild=242
pluginUntilBuild=252.*

# --- toolchain pins (JB0: confirm against current Plugin SDK docs) ---
kotlinVersion=2.0.21
intellijPlatformPluginVersion=2.1.0
kotlinxSerializationVersion=1.7.3
javaToolchainVersion=17

# --- Kotlin flags ---
# The IntelliJ Platform ships its own Kotlin stdlib; the platform plugin docs
# recommend not adding a stdlib dependency to the distribution. JB0: confirm the
# combination with Kotlin Gradle Plugin 2.0.x (a missing stdlib fails compilation).
kotlin.stdlib.default.dependency=false
kotlin.code.style=official
# Experimental API opt-in is done per-site with @OptIn(ExperimentalSerializationApi::class)
# in labs/dkv/sandpane/model/Models.kt — no global -opt-in compiler flag in this scaffold.

org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Searchable options are disabled for a scaffold: indexing the sandbox IDE on every
# build is slow and adds no verified value before JB4.
enableBuildSearchableOptions=false
