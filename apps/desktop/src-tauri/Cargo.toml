[package]
name = "sandpane-desktop"
version = "0.0.0"
description = "Sandpane Desktop — Tauri 2 shell with a narrow Core IPC proxy"
authors = ["DKV Labs"]
edition = "2021"
rust-version = "1.90"
license = "MIT"

# Deliberately NOT a member of the `core/` Cargo workspace: this crate keeps its
# own lockfile and dependency graph, yet depends on `sandpane-protocol` by path so
# the method allowlist it enforces cannot drift from Core's own `Method::parse`.
# (Path dependencies resolve the referenced crate inside ITS workspace, which is
# what makes `version.workspace = true` there still work.)

[dependencies]
tauri = { version = "~2.12.2", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Three levels up, not two: src-tauri → desktop → apps → repo root. The
# previous `../../core/...` resolved to `apps/core/crates/sandpane-protocol`,
# which does not exist, so `cargo check` failed at dependency resolution
# ("no matching package named `sandpane-protocol`") and this crate had never
# been compiled. See docs/audit/ and apps/desktop/README.md "Verification".
sandpane-protocol = { path = "../../../core/crates/sandpane-protocol" }

# `getuid()` for the socket-ownership check before every connect (W4). Already in
# the lockfile at the version Tauri resolves; added as a direct dependency only.
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[build-dependencies]
tauri-build = { version = "~2.7.1", features = [] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
